name = "Crear mascota"
method = "POST"
url = "{{base_url}}/{{api_version}}/pet"

[headers]
Content-Type = "application/json"

[body]
type = "json"
json = '''
{ "name": "Firulais", "status": "available" }
'''

[scripts]
post = "harpoon.vars.set('pet_id', harpoon.res.json().id)"
test = """
test('crea la mascota', () => {
  expect(harpoon.res.status).to.equal(200);
});
"""
