[workspace]
resolver = "3"
members = ["crates/harpoon-core", "crates/harpoon-cli", "crates/harpoon-http"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sergiusdev/harpoon"
rust-version = "1.85"

[workspace.dependencies]
harpoon-core = { path = "crates/harpoon-core" }
harpoon-http = { path = "crates/harpoon-http" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
indexmap = { version = "2", features = ["serde"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "gzip", "http2", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
